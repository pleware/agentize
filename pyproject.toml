[project]
name = "agentize"
version = "0.1.0.dev0"
description = "One project config. Every agent host."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PWare", email = "pawel@pware.ai" }]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://pware.ai"

[project.scripts]
agentize = "agentize.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentize"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
