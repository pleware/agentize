name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint + tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync --group dev

      # ruff stays local (tracked in the umbrella backlog). Pre-existing import order
      # would fail a public CI on a kit that is still abstract.

      - name: Tests + coverage
        run: uv run pytest --cov=agentize --cov-report=xml --cov-report=term

      # Coverage % stays informational in codecov.yml. A failed upload
      # still fails the job.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: true
          use_oidc: true
